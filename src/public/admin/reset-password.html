<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | WorldNet</title>
    <link rel="stylesheet" href="/css/admin.css" />
</head>

<body class="login-body">
    <div class="login-card">
        <div class="brand-mark">W</div>
        <h1>Set a new password</h1>
        <p class="login-sub">Choose a new password for your admin account.</p>
        <form id="reset-form" class="login-form" autocomplete="on">
            <input type="hidden" id="reset-token" name="token" />
            <div>
                <label for="password">New password</label>
                <div class="password-field">
                    <input id="password" type="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
                    <button type="button" class="password-toggle" data-target="password" aria-label="Show password"></button>
                </div>
            </div>
            <div>
                <label for="confirm">Confirm new password</label>
                <div class="password-field">
                    <input id="confirm" type="password" name="confirm" placeholder="Repeat the password" required minlength="8" autocomplete="new-password" />
                    <button type="button" class="password-toggle" data-target="confirm" aria-label="Show password"></button>
                </div>
            </div>
            <button class="btn-wn btn-wn-primary" type="submit" style="width:100%; padding:0.85rem">Reset password</button>
        </form>
        <p style="text-align:center; margin:1.1rem 0 0">
            <a href="/admin/login.html" class="auth-link">Back to sign in</a>
        </p>
        <p style="text-align:center; font-size:0.78rem; color:#64748b; margin:1.1rem 0 0">WorldNet ICT Solutions · Admin
            Console</p>
    </div>
    <div id="toast" class="wn-toast"></div>
    <script src="/js/admin.js"></script>
</body>

</html>
