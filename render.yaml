version: "1"
services:
  - type: web
    name: worldnet-ict-solutions
    runtime: node
    rootDir: src
    plan: free
    region: ohio
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: postgre-World_Net Solutions
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: no-reply@worldnetict.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false

databases:
  - name: postgre-World_Net Solutions
    databaseName: postgre_world_net_solutions
    user: postgre_world_net_solutions_user
    plan: free
    region: ohio
    postgresMajorVersion: "18"
    ipAllowList: []