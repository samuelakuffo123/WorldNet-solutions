name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        working-directory: src
        run: npm ci
      - name: Syntax check all JavaScript
        working-directory: src
        run: npm run check

  integration-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: src/package-lock.json
      - name: Install dependencies
        working-directory: src
        run: npm ci
      - name: Run integration suite
        working-directory: src
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: pg-mem://worldnet-test