<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | WorldNet</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <script>try{if(localStorage.getItem('worldnet_theme')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}</script>
</head>

<body class="login-body">
    <div class="login-card">
    <button type="button" class="icon-button theme-toggle login-theme-toggle" id="theme-toggle" title="Switch to dark mode" aria-label="Switch to dark mode"><span class="theme-icon">☾</span></button>
        <div class="brand-mark">W</div>
        <h1>Forgot your password?</h1>
        <p class="login-sub">Enter your admin email and we'll send you a reset link.</p>
        <form id="forgot-form" class="login-form" autocomplete="on">
            <div>
                <label for="email">Email address</label>
                <input id="email" type="email" name="email" placeholder="admin@worldnetict.com" required autocomplete="email" />
            </div>
            <button class="btn-wn btn-wn-primary" type="submit" style="width:100%; padding:0.85rem">Send reset link</button>
        </form>
        <div id="forgot-success" class="auth-success"></div>
        <p style="text-align:center; margin:1.1rem 0 0">
            <a href="/admin/login.html" class="auth-link">Back to sign in</a>
        </p>
        <p style="text-align:center; font-size:0.78rem; color:#64748b; margin:1.1rem 0 0">WorldNet ICT Solutions · Admin
            Console</p>
    </div>
    <div id="toast" class="wn-toast"></div>
    <script src="/js/admin.js"></script>
</body>

</html>
