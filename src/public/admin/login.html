<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Sign In | WorldNet</title>
    <link rel="stylesheet" href="/css/admin.css" />
</head>

<body class="login-body">
    <div class="login-card">
        <div class="brand-mark">W</div>
        <h1>Welcome back</h1>
        <p class="login-sub">Sign in with your staff ID or email. We'll route you to the right portal.</p>

        <form id="login-form" class="login-form" autocomplete="on">
            <div>
                <label for="identifier">Staff ID or email</label>
                <input id="identifier" type="text" name="identifier" placeholder="e.g. wrk-1a2b3c or you@worldnetict.com" required autocomplete="username" />
            </div>
            <div>
                <label for="password">Password</label>
                <div class="password-field">
                    <input id="password" type="password" name="password" placeholder="••••••••" required autocomplete="current-password" />
                    <button type="button" class="password-toggle" data-target="password" aria-label="Show password"></button>
                </div>
            </div>
            <button class="btn-wn btn-wn-primary" type="submit" style="width:100%; padding:0.85rem">Sign in</button>
        </form>

        <p style="text-align:center; margin:1.1rem 0 0">
            <a href="/admin/forgot-password.html" class="auth-link">Forgot your password?</a>
        </p>
        <p style="text-align:center; font-size:0.78rem; color:#64748b; margin:1.1rem 0 0">WorldNet ICT Solutions · Team
            Console</p>
    </div>
    <div id="toast" class="wn-toast"></div>
    <script src="/js/admin.js"></script>
</body>

</html>
