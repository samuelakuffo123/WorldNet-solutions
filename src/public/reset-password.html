<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset password | WorldNet ICT Solutions</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <main class="section">
        <div class="container" style="max-width: 440px">
            <div class="card" style="padding:2rem">
                <h1 style="margin-top:0">Set a new password</h1>
                <p class="muted">Choose a new password for your account.</p>
                <form id="reset-form" class="form-grid" novalidate>
                    <input type="hidden" id="reset-token" name="token" />
                    <div>
                        <label for="password">New password</label>
                        <input id="password" type="password" name="password" placeholder="At least 8 characters" required minlength="8" autocomplete="new-password" />
                    </div>
                    <div>
                        <label for="confirm">Confirm new password</label>
                        <input id="confirm" type="password" name="confirm" placeholder="Repeat the password" required minlength="8" autocomplete="new-password" />
                    </div>
                    <button class="btn btn-primary" type="submit">Reset password</button>
                    <p data-form-status class="muted" aria-live="polite"></p>
                </form>
                <p><a href="/">Back to home</a></p>
            </div>
        </div>
    </main>

    <script>
        (function () {
            const form = document.getElementById('reset-form');
            const params = new URLSearchParams(window.location.search);
            const token = params.get('token') || '';
            document.getElementById('reset-token').value = token;
            form.addEventListener('submit', async (event) => {
                event.preventDefault();
                const status = form.querySelector('[data-form-status]');
                const password = form.password.value;
                const confirm = form.confirm.value;
                if (password !== confirm) {
                    status.textContent = 'Passwords do not match.';
                    status.className = 'muted';
                    return;
                }
                status.textContent = 'Updating password…';
                try {
                    const response = await fetch('/api/reset-password', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token, password })
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok) throw new Error(data.error || 'Password reset failed');
                    status.textContent = data.message || 'Password updated.';
                    status.className = 'muted';
                    form.reset();
                    setTimeout(() => { window.location.href = '/'; }, 1400);
                } catch (error) {
                    status.textContent = error.message;
                }
            });
        })();
    </script>
</body>

</html>
