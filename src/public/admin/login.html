<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | WorldNet</title>
    <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
    <main class="section">
        <div class="container" style="max-width:480px">
            <div class="card" style="padding:1.5rem">
                <h1>Admin login</h1>
                <p class="muted">Use the seeded admin credentials to access the dashboard.</p>
                <form id="login-form" class="form-grid" style="margin-top:1rem">
                    <div><label>Email</label><input type="email" name="email" value="admin@worldnetict.com" required />
                    </div>
                    <div><label>Password</label><input type="password" name="password" value="admin123" required />
                    </div>
                    <button class="btn btn-primary" type="submit">Log in</button>
                </form>
            </div>
        </div>
    </main>
    <div id="toast" class="toast"></div>
    <script src="/js/admin.js"></script>
</body>

</html>
